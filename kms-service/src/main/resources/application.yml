server:
  port: 8085

spring:
  application:
    name: kms-service
  datasource:
    url: jdbc:h2:file:./data/kms_encrypted_db;CIPHER=AES;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: kms_admin
    password: ${KMS_MASTER_KEY:SecureMasterKey1234567890AESPassword} kms_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

kms:
  master-key: ${KMS_MASTER_KEY:SecureMasterKey1234567890AESPassword}
  default-key-size: 2048
  default-key-id: zerotrust-master-key-v1
